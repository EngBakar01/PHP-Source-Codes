
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
</head>
<body>
    <h1>Employee Registration and Document Upload System</h1>

    <!-- Send employee information and document to process.php -->
    <form action="process.php" method="post" enctype="multipart/form-data">
        <label for="fullname">Employee Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
        <hr>

        <label for="empID">Employee ID</label>
        <input type="text" id="empID" name="empID" required>
        <hr>

        <!-- Gender: select only one -->
        <label>Gender</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
        <hr>

        <!-- Select one department -->
        <label for="department">Department</label>
        <select name="department" id="department" required>
            <option value="" selected disabled>Select Department</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Administration">Administration</option>
        </select>
        <hr>

        <!-- Employment Type -->
        <label>Employment Type</label>
        <div class="radio-group">
            <label><input type="radio" name="emp_type" value="Full-Time" required> Full-Time</label>
            <label><input type="radio" name="emp_type" value="Part-Time"> Part-Time</label>
        </div>
        <hr>

        <label for="basic_salary">Basic Salary</label>
        <input type="number" id="basic_salary" name="basic_salary" min="0.01" step="0.01" required>
        <hr>

        <label for="allowance">Allowance</label>
        <input type="number" id="allowance" name="allowance" min="0" step="0.01" required>
        <hr>

        <label for="deduction">Deduction</label>
        <input type="number" id="deduction" name="deduction" min="0" step="0.01" required>
        <hr>

        <label for="yrs_of_Service">Years of Service</label>
        <input type="number" id="yrs_of_Service" name="yrs_of_Service" min="0" step="1" required>
        <hr>

        <!-- File upload requires multipart/form-data -->
        <label for="document">Employee Document</label>
        <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png" required>
        <p>Accepted file types: PDF, JPG, JPEG, PNG. Maximum size: 2 MB.</p>
        <hr>

        <input type="submit" name="submit" value="Submit">
        <input type="reset" value="Reset Form">
    </form>
</body>
</html>
